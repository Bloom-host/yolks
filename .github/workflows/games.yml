name: build games
on:
  workflow_dispatch:
  # Rebuild after every java build (including its monthly one): hytale bakes in java_25's entrypoint.
  # Not gated on success: one failed java job fails the whole run, and a rebuild on the old java_25 is harmless.
  workflow_run:
    workflows: ["build java"]
    types: [completed]
  push:
    branches:
      - master
    paths:
      - games/**
# The last triggered build wins, so an older in-flight one can't publish over a newer java_25 base.
concurrency:
  group: games
  cancel-in-progress: true
jobs:
  push:
    name: "games:${{ matrix.game }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - hytale
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase repo
        run: |
          echo "REPO=${GITHUB_REPOSITORY@L}" >> "${GITHUB_ENV}"
      - uses: docker/build-push-action@v4
        with:
          context: ./games/${{ matrix.game }}
          file: ./games/${{ matrix.game }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/games:${{ matrix.game }}
