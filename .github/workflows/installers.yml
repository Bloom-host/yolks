name: build installers
on:
  workflow_dispatch:
  schedule:
    # weekly, so the baked-in apt lists and package fixes stay fresh
    - cron: "0 0 * * 1"
  push:
    branches:
      - master
    paths:
      - installers/**
      - .github/workflows/installers.yml
permissions:
  contents: read
  packages: write
jobs:
  push:
    name: "installers:${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - alpine
          - debian
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase repo owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> "${GITHUB_ENV}"
      - uses: docker/build-push-action@v4
        with:
          context: ./installers
          file: ./installers/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/installers:${{ matrix.tag }}
